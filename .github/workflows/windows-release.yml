name: Native Windows WPF - Build and Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/screenshots/native/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-windows-release
  cancel-in-progress: false
jobs:
  native-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate original Brendigo launcher ICO
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/make-icon.ps1
      - name: Prepare License Studio icon
        run: |
          New-Item -ItemType Directory -Force -Path src/Brendigo.Web2APK.LicenseStudio/Assets | Out-Null
          Copy-Item src/Brendigo.Web2APK.Windows/Assets/Brendigo.ico src/Brendigo.Web2APK.LicenseStudio/Assets/Brendigo.ico
      - name: Test Android generator and storage
        run: dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj
      - name: Verify production UI text and responsive layouts
        run: pwsh -NoProfile -File tests/check-ui-labels.ps1
      - name: Compile Brendigo License Studio
        run: dotnet build src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj -c Release
      - name: Compile native Windows application
        run: dotnet build src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj -c Release
      - name: Build isolated UI capture executable (NOT included in release)
        run: |
          dotnet publish src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj -c Release -r win-x64 --self-contained true -p:DefineConstants=UI_CAPTURE -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ui-capture
      - name: Preserve tracked WPF screenshots as visual regression baseline
        run: |
          New-Item -ItemType Directory -Force -Path wpf-baseline | Out-Null
          Copy-Item docs/screenshots/native/*.png wpf-baseline/ -Force
      - name: Capture and verify actual native WPF screens
        run: |
          $exe = (Resolve-Path './ui-capture/Brendigo.Web2APK.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--capture-native' -WorkingDirectory $PWD -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'WPF capture timed out.'
          }
          if ($process.ExitCode -ne 0) {
            foreach ($log in @('./docs/screenshots/native-progress.log','./docs/screenshots/native-error.log')) {
              if (Test-Path $log) { Get-Content $log | Write-Host }
            }
            throw "WPF capture returned $($process.ExitCode)."
          }
          dotnet publish src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj -c Release -r win-x64 --self-contained true -p:DefineConstants=UI_CAPTURE -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o license-ui-capture
          if ($LASTEXITCODE -ne 0) { throw 'License Studio UI capture build failed.' }
          $licenseExe = (Resolve-Path './license-ui-capture/Brendigo.LicenseStudio.exe').Path
          $licenseProcess = Start-Process -FilePath $licenseExe -ArgumentList '--capture-native' -WorkingDirectory $PWD -PassThru
          if (-not $licenseProcess.WaitForExit(90000)) {
            $licenseProcess.Kill()
            throw 'License Studio WPF capture timed out.'
          }
          if ($licenseProcess.ExitCode -ne 0) { throw "License Studio WPF capture returned $($licenseProcess.ExitCode)." }
          foreach($studio in @('license-studio','license-studio-compact-900',
              'license-studio-minimum-760')) {
            if(-not (Test-Path "./docs/screenshots/native/$studio.png")) {
              throw "Missing real License Studio capture: $studio"
            }
          }
          $screens = @(Get-ChildItem './docs/screenshots/native' -Filter '*.png')
          if ($screens.Count -lt 65) { throw "Expected at least 65 real UI captures, found $($screens.Count)" }
          foreach ($capture in @('wizard-compact-1024','preview-compact-1024','wizard-small-900','preview-small-900','welcome-small-900','dashboard-small-900','projects-small-900','settings-small-900','tools-small-900','docs-small-900','devices-small-900','about-small-900',
              'wizard-1-small-900','wizard-2-small-900','wizard-3-small-900',
              'wizard-4-small-900','wizard-5-small-900','wizard-6-small-900',
              'welcome-minimum-840','dashboard-minimum-840','projects-minimum-840',
              'preview-minimum-840','tools-minimum-840','devices-minimum-840',
              'settings-minimum-840','docs-minimum-840','about-minimum-840',
              'wizard-1-minimum-840','wizard-2-minimum-840','wizard-3-minimum-840',
              'wizard-4-minimum-840','wizard-5-minimum-840','wizard-6-minimum-840',
              'wizard-1-compact-1024','wizard-2-compact-1024','wizard-3-compact-1024',
              'wizard-4-compact-1024','wizard-5-compact-1024','wizard-6-compact-1024',
              'preview-tablet-small-900','preview-offline-small-900',
              'preview-no-splash-small-900','preview-phone-minimum-840',
              'source-viewer','source-viewer-minimum-760')) {
            if (-not (Test-Path "./docs/screenshots/native/$capture.png")) {
              throw "Missing responsive layout capture: $capture"
            }
          }
          if (Test-Path './docs/screenshots/native-progress.log') {
            Get-Content './docs/screenshots/native-progress.log' | Write-Host
          }
          Add-Type -AssemblyName System.Drawing
          $licenseImage = [System.Drawing.Bitmap]::FromFile((Resolve-Path './docs/screenshots/native/license-studio.png').Path)
          try {
            if ($licenseImage.Width -lt 760 -or $licenseImage.Height -lt 530) {
              throw "License Studio real capture is too small: $($licenseImage.Width)x$($licenseImage.Height)"
            }
          }
          finally { $licenseImage.Dispose() }
          # Bitmap-density check: not a replacement for a real per-monitor DPI test.
          foreach ($percent in @(125,150,200)) {
            $captureFile="./docs/screenshots/native/wizard-density-$percent.png"
            if (-not (Test-Path $captureFile)) { throw "Missing WPF density capture at $percent percent" }
            $bitmap=[System.Drawing.Bitmap]::FromFile((Resolve-Path $captureFile).Path)
            try {
              $width=[int][Math]::Round(900*$percent/100.0)
              $height=[int][Math]::Round(650*$percent/100.0)
              if ($bitmap.Width -ne $width -or $bitmap.Height -ne $height) {
                throw "Unexpected screenshot size at $percent percent"
              }
            }
            finally { $bitmap.Dispose() }
          }
          foreach ($name in @('wizard-1-basics','preview')) {
            $bitmap = [System.Drawing.Bitmap]::FromFile((Resolve-Path "./docs/screenshots/native/$name.png").Path)
            try {
              if ($bitmap.Width -ne 1440 -or $bitmap.Height -ne 900) {
                throw "Wrong dimensions for $name"
              }
              foreach($point in @(@(100,100),@(800,400),@(1050,400),@(1250,600),@(1400,860))) {
                $sample=$bitmap.GetPixel($point[0],$point[1])
                Write-Host "$name pixel($($point[0]),$($point[1])) RGBA=$($sample.R),$($sample.G),$($sample.B),$($sample.A)"
              }
              $pixel = $bitmap.GetPixel(1400,860)
              if ($pixel.R -le 3 -and $pixel.G -le 3 -and $pixel.B -le 3) {
                throw "Clipped or black screenshot in $name. WPF must render at 1440 x 900."
              }
            }
            finally { $bitmap.Dispose() }
          }
          pwsh -NoProfile -File scripts/compare-wpf-screens.ps1
          $pixelAuditPath='visual-audit/native-full-pixel-audit.json'
          if(-not (Test-Path $pixelAuditPath)) {
            throw 'Missing exact per-pixel WPF regression report.'
          }
          $report=Get-Content $pixelAuditPath -Raw | ConvertFrom-Json
          if(@($report.screens).Count -lt 20) {
            throw "Expected at least 20 actual native full-pixel comparisons."
          }
          Write-Host "Completed exact pixel comparisons for $(@($report.screens).Count) WPF screens."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/native/*.png
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'docs: capture real Windows WPF screens [skip ci]'
            git push origin HEAD:main
          }
      - name: Upload WPF visual regression measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brendigo-wpf-visual-audit
          path: |
            visual-audit/wpf-visual-regression.json
            visual-audit/native-full-pixel-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish self-contained portable.exe
        run: |
          dotnet publish src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:EnableCompressionInSingleFile=true -o publish
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item publish/Brendigo.Web2APK.exe release/Brendigo-Web2APK-portable.exe
      - name: Publish License Studio standalone EXE
        run: |
          dotnet publish src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:EnableCompressionInSingleFile=true -o publish-license
          Copy-Item publish-license/Brendigo.LicenseStudio.exe release/Brendigo-LicenseStudio-portable.exe
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup.exe
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $compiler installer/Brendigo-Web2APK.iss
          if ($LASTEXITCODE -ne 0) { throw 'Main installer failed.' }
          & $compiler installer/Brendigo-LicenseStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed.' }
      - name: Verify both Windows EXE packages
        run: |
          foreach ($item in @("release/Brendigo-Web2APK-portable.exe","release/Brendigo-Web2APK-Setup.exe","release/Brendigo-LicenseStudio-portable.exe","release/Brendigo-LicenseStudio-Setup.exe")) {
            if (-not (Test-Path $item)) { throw "Missing mandatory file: $item" }
            if ((Get-Item $item).Length -lt 1000000) { throw "Invalid file size: $item" }
            Write-Host "$item verified"
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
      - name: Compile generated Android WebView app (permissions smoke test)
        run: |
          dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj -- --fixture build-smoke
          gradle -p build-smoke :app:assembleDebug --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Generated Android project failed to compile' }
      - name: Compile AdMob integration with test ad units
        run: |
          dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj -- --ads-fixture ads-smoke
          gradle -p ads-smoke :app:assembleDebug --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'AdMob + UMP integration does not compile.' }
      - name: Compile Firebase Messaging integration with test configuration
        run: |
          dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj -- --firebase-fixture fcm-smoke
          gradle -p fcm-smoke/project :app:assembleDebug --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Firebase Messaging integration does not compile.' }
      - name: Compile Professional pull-to-refresh Android project
        run: |
          dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj -- --refresh-fixture refresh-smoke
          gradle -p refresh-smoke :app:assembleDebug --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Android pull-to-refresh integration does not compile.' }
      - name: Compile Android Mobile client (APK + AAB)
        run: |
          gradle -p android :app:assembleDebug :app:bundleRelease --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Android Mobile client failed to compile' }
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk release/Brendigo-Web2APK-Android-test.apk
          Copy-Item android/app/build/outputs/bundle/release/app-release.aab release/Brendigo-Web2APK-Android-unsigned.aab
          foreach ($item in @("release/Brendigo-Web2APK-Android-test.apk","release/Brendigo-Web2APK-Android-unsigned.aab")) {
            if (-not (Test-Path $item)) { throw "Android package is missing: $item" }
            if ((Get-Item $item).Length -lt 30000) { throw "Android package is too small: $item" }
          }
      - name: Publish native v0.6.10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.6.10'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Increment version for each new release.' }
          gh release create $tag "release/Brendigo-Web2APK-portable.exe" "release/Brendigo-Web2APK-Setup.exe" "release/Brendigo-LicenseStudio-portable.exe" "release/Brendigo-LicenseStudio-Setup.exe" "release/Brendigo-Web2APK-Android-test.apk" "release/Brendigo-Web2APK-Android-unsigned.aab" --repo "$env:GITHUB_REPOSITORY" --target (git rev-parse HEAD) --title "Brendigo Web2APK Builder + License Studio v0.6.10" --notes-file CHANGELOG.md
