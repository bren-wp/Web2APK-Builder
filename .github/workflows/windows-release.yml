name: Windows Studio - Build and Release
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test project storage and Android generator
        run: npm test
      - name: Verify JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src,scripts,tests -Recurse -Include *.cjs,*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Package Windows installer and portable EXE
        run: npm run dist:win
      - name: Check both Windows artifacts
        shell: pwsh
        run: |
          $expected = @("release/Brendigo-Web2APK-portable.exe", "release/Brendigo-Web2APK-Setup.exe")
          foreach ($name in $expected) {
            if (-not (Test-Path $name)) { throw "Missing release file: $name" }
            if ((Get-Item $name).Length -lt 1000000) { throw "Release file is too small: $name" }
          }
      - name: Save screenshots from real desktop UI renderer
        continue-on-error: true
        shell: pwsh
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node scripts/capture-screenshots.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: refresh real UI screenshots [skip ci]"
            git push origin HEAD:main
          }
      - name: Create new versioned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Version already released. Increase package.json version before each release." }
          gh release create $tag "release/Brendigo-Web2APK-portable.exe" "release/Brendigo-Web2APK-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Brendigo Web2APK Builder $tag - Windows" --notes-file CHANGELOG.md
