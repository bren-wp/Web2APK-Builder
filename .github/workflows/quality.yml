name: Native Windows WPF - Quality
on:
  push:
    branches: [main]
    paths-ignore: ['docs/screenshots/native/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/make-icon.ps1
      - run: dotnet run -c Release --project tests/Brendigo.Web2APK.Core.Tests/Brendigo.Web2APK.Core.Tests.csproj
      - run: |
          New-Item -ItemType Directory -Force -Path src/Brendigo.Web2APK.LicenseStudio/Assets | Out-Null
          Copy-Item src/Brendigo.Web2APK.Windows/Assets/Brendigo.ico src/Brendigo.Web2APK.LicenseStudio/Assets/Brendigo.ico
      - run: dotnet build src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj -c Release
      - run: dotnet build src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj -c Release
      - run: pwsh -NoProfile -File tests/check-ui-labels.ps1
      - name: Roslyn security and unused-code analysis
        shell: pwsh
        run: |
          dotnet build src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj -c Release -p:RunAnalyzers=true -p:AnalysisLevel=latest-all -p:EnforceCodeStyleInBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Roslyn analysis failed.' }
          dotnet build src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj -c Release -p:RunAnalyzers=true -p:AnalysisLevel=latest-all -p:EnforceCodeStyleInBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'License Studio analyzer build failed.' }
      - name: NuGet dependency vulnerability audit
        shell: pwsh
        run: |
          foreach ($project in @(
            'src/Brendigo.Web2APK.Windows/Brendigo.Web2APK.Windows.csproj',
            'src/Brendigo.Web2APK.LicenseStudio/Brendigo.Web2APK.LicenseStudio.csproj'
          )) {
            dotnet list $project package --vulnerable --include-transitive
            if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability query failed: $project" }
          }
